<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "맑은 고딕", sans-serif;
    background: #1e1e2e;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 { text-align: center; }
  .add-box {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 20px 0;
  }
  .add-box input {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    width: 240px;
  }
  .add-box button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #7c6bff;
    color: #fff;
    cursor: pointer;
    font-size: 15px;
  }
  .tier-row {
    display: flex;
    margin-bottom: 8px;
    border-radius: 6px;
    overflow: hidden;
    min-height: 70px;
  }
  .tier-label {
    width: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #222;
  }
  .S .tier-label { background: #ff7f7f; }
  .A .tier-label { background: #ffbf7f; }
  .B .tier-label { background: #ffff7f; }
  .C .tier-label { background: #7fff7f; }
  .D .tier-label { background: #7fbfff; }
  .pool-label { background: #999; }
  .drop-area {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    background: #2a2a3e;
    align-content: flex-start;
  }
  .movie {
    background: #44446a;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: grab;
    user-select: none;
  }
  .movie:active { cursor: grabbing; }
  .pool { margin-top: 20px; }
</style>
</head>
<body>
  <h1>🎬 영화 티어리스트</h1>

  <div class="add-box">
    <input type="text" id="movieInput" placeholder="영화 제목을 입력하세요">
    <button onclick="addMovie()">영화 추가</button>
  </div>

  <div id="tiers"></div>

  <div class="tier-row pool">
    <div class="tier-label pool-label">목록</div>
    <div class="drop-area" data-tier="pool" id="pool"></div>
  </div>

<script>
  const TIERS = ["S", "A", "B", "C", "D"];
  const DEFAULT_MOVIES = [
    "기생충", "인터스텔라", "라라랜드", "센과 치히로의 행방불명",
    "어벤져스: 엔드게임", "범죄도시", "타이타닉", "토이 스토리"
  ];

  // 저장된 데이터 불러오기 (없으면 기본값)
  let data = JSON.parse(localStorage.getItem("tierData"));
  if (!data) {
    data = { pool: [...DEFAULT_MOVIES] };
    TIERS.forEach(t => data[t] = []);
    saveData();
  }

  function saveData() {
    localStorage.setItem("tierData", JSON.stringify(data));
  }

  // 티어 행 그리기
  function render() {
    const tiersDiv = document.getElementById("tiers");
    tiersDiv.innerHTML = "";
    TIERS.forEach(t => {
      const row = document.createElement("div");
      row.className = "tier-row " + t;
      row.innerHTML = `
        <div class="tier-label">${t}</div>
        <div class="drop-area" data-tier="${t}"></div>`;
      tiersDiv.appendChild(row);
    });

    // 모든 영역에 영화 배치
    document.querySelectorAll(".drop-area").forEach(area => {
      const tier = area.dataset.tier;
      area.innerHTML = "";
      data[tier].forEach(title => {
        const el = document.createElement("div");
        el.className = "movie";
        el.textContent = title;
        el.draggable = true;
        el.dataset.title = title;
        el.addEventListener("dragstart", onDragStart);
        area.appendChild(el);
      });
      area.addEventListener("dragover", e => e.preventDefault());
      area.addEventListener("drop", onDrop);
    });
  }

  let dragging = null;
  function onDragStart(e) {
    dragging = e.target.dataset.title;
  }

  function onDrop(e) {
    e.preventDefault();
    if (!dragging) return;
    // 모든 티어에서 제거 후 현재 영역에 추가
    Object.keys(data).forEach(tier => {
      data[tier] = data[tier].filter(m => m !== dragging);
    });
    const targetTier = e.currentTarget.dataset.tier;
    data[targetTier].push(dragging);
    dragging = null;
    saveData();
    render();
  }

  function addMovie() {
    const input = document.getElementById("movieInput");
    const title = input.value.trim();
    if (!title) return;
    // 중복 방지
    const all = Object.values(data).flat();
    if (all.includes(title)) {
      alert("이미 있는 영화예요!");
      return;
    }
    data.pool.push(title);
    input.value = "";
    saveData();
    render();
  }

  render();
</script>
</body>
</html>
